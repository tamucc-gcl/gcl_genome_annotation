  <title
     id="title">GCL Genome Annotation Pipeline</title>
  <desc
     id="desc">A broad overview of the Nextflow DSL2 pipeline. Prepared assemblies undergo repeat discovery, curation and softmasking. RNA and protein evidence support BRAKER3 gene prediction, with genome-only prediction also supported. Optional UTR refinement and model assessment precede structural selection and final identifiers, then functional annotation. Before and after selection quality control, repeat annotations, and independent genome tracks accompany the validated annotation release and unified report. Analyses depend on enabled settings and available evidence.</desc>
